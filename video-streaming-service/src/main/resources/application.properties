# Server Port
server.port=${PORT:${SERVER_PORT:8080}}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:500MB}

# Storage directory for uploaded videos & HLS chunks
video.upload.dir=${VIDEO_UPLOAD_DIR:./uploads}

# Path to ffmpeg binary (default: searches system PATH)
ffmpeg.path=${FFMPEG_PATH:ffmpeg}

# HLS segment duration in seconds (Netflix standard is ~4 seconds)
hls.segment.time=${HLS_TIME:4}

# Allowed CORS origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Async executor thread name prefix
spring.async.executor.thread.name.prefix=video-async-
