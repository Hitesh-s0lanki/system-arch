<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768"><rect width="1376" height="768" fill="#0d1117"/><g font-family="Arial,sans-serif"><text x="72" y="100" fill="#f8fafc" font-size="44" font-weight="700">Sliding Window Counter</text><text x="72" y="152" fill="#a9b8ca" font-size="24">A rolling estimate, using only two counters.</text><rect x="72" y="220" width="590" height="230" rx="18" fill="#242039" stroke="#a78bfa" stroke-width="3"/><rect x="686" y="220" width="618" height="230" rx="18" fill="#17273d" stroke="#60a5fa" stroke-width="3"/><text x="108" y="277" fill="#c4b5fd" font-size="25">PREVIOUS MINUTE</text><text x="108" y="352" fill="#fff" font-size="48">80 requests</text><text x="108" y="406" fill="#c4b5fd" font-size="25">75% still overlaps the rolling window</text><text x="722" y="277" fill="#93c5fd" font-size="25">CURRENT MINUTE</text><text x="722" y="352" fill="#fff" font-size="48">30 requests</text><text x="722" y="406" fill="#93c5fd" font-size="25">15 of 60 seconds elapsed (25%)</text><rect x="72" y="500" width="1232" height="170" rx="18" fill="#102c27" stroke="#34d399" stroke-width="2"/><text x="108" y="554" fill="#6ee7b7" font-size="24">ESTIMATED USAGE = PREVIOUS × REMAINING FRACTION + CURRENT</text><text x="108" y="620" fill="#fff" font-size="39">80 × 0.75 + 30 = 90 requests</text></g></svg>