<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="768" viewBox="0 0 1376 768"><rect width="1376" height="768" fill="#0d1117"/><g font-family="Arial,sans-serif"><text x="72" y="100" fill="#f8fafc" font-size="44" font-weight="700">Leaky Bucket Meter</text><text x="72" y="152" fill="#a9b8ca" font-size="24">Track a level. Drain with time. Decide immediately.</text><rect x="72" y="225" width="360" height="260" rx="18" fill="#17273d" stroke="#60a5fa" stroke-width="3"/><text x="108" y="285" fill="#93c5fd" font-size="25">RECENT USAGE</text><text x="108" y="368" fill="#fff" font-size="54">8 / 10</text><text x="108" y="430" fill="#a9b8ca" font-size="25">Current level / capacity</text><text x="462" y="357" fill="#a9b8ca" font-size="45">→</text><rect x="532" y="225" width="340" height="260" rx="18" fill="#242039" stroke="#a78bfa" stroke-width="3"/><text x="568" y="285" fill="#c4b5fd" font-size="25">AFTER 1 SECOND</text><text x="568" y="368" fill="#fff" font-size="54">6 / 10</text><text x="568" y="430" fill="#a9b8ca" font-size="25">Drain rate: 2 / second</text><text x="903" y="357" fill="#a9b8ca" font-size="45">→</text><rect x="976" y="225" width="328" height="260" rx="18" fill="#102c27" stroke="#34d399" stroke-width="3"/><text x="1012" y="285" fill="#6ee7b7" font-size="25">NEXT REQUEST</text><text x="1012" y="368" fill="#fff" font-size="54">7 / 10</text><text x="1012" y="430" fill="#a9b8ca" font-size="25">Fits → accept + add 1</text><rect x="72" y="540" width="1232" height="120" rx="18" fill="#161d28"/><text x="108" y="590" fill="#fff" font-size="27">Would the next request exceed capacity? Reject with a retry delay.</text><text x="108" y="633" fill="#a9b8ca" font-size="24">Accepted requests forward immediately. No queue. No outgoing pacing.</text></g></svg>