apiVersion: v1
kind: ConfigMap
metadata:
  name: rate-limiter
  labels: {app: rate-limiter}
data:
  proxy.json: |
    {
      "version": 1,
      "listen": ":8080",
      "upstream": "http://backend:8080",
      "storage": {"mode":"redis","namespace":"production","timeout":"500ms","pool_size":32},
      "cleanup_interval":"1s",
      "upstream_timeout":"10s",
      "max_body_bytes":1048576,
      "max_concurrent":64,
      "tenants":["public"],
      "anonymous_tenant":"public",
      "trusted_proxies":[],
      "forward_authorization":false,
      "routes":[{"pattern":"/","policy":{"id":"default-ip","identity":"ip","per_route":false},"revision":"v1","limit":100,"window":"1m","max_keys":10000}]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-limiter
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: rate-limiter}
  template:
    metadata:
      labels: {app: rate-limiter}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: rate-limiter}
      containers:
        - name: gateway
          # Replace with the immutable image digest produced by your release build.
          image: rate-limiter:release
          imagePullPolicy: IfNotPresent
          args: [-config, /etc/ratelimit/proxy.json]
          ports: [{name: http, containerPort: 8080}]
          env:
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: rate-limiter, key: redis-url}}
            - name: RATE_LIMIT_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: rate-limiter, key: metrics-token}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/ratelimit, readOnly: true}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
      volumes:
        - name: config
          configMap: {name: rate-limiter}
---
apiVersion: v1
kind: Service
metadata:
  name: rate-limiter
spec:
  selector: {app: rate-limiter}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rate-limiter
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: rate-limiter}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rate-limiter
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: rate-limiter}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rate-limiter
spec:
  podSelector:
    matchLabels: {app: rate-limiter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports: [{protocol: TCP, port: 8080}]
